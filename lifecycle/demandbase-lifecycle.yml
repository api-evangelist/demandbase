  note: >-
    Demandbase publishes no formal deprecation policy, no RFC 8594 Sunset/Deprecation header
    support, and no dated end-of-life calendar. What it does publish is per-migration
    guidance when a surface is superseded, which is a weaker but real signal.
  observed_migrations:
    - from: Legacy user-scoped API tokens
