capabilities:
  - area: Internal account data
    description: >-
      Search and prioritize accounts using engagement, journey stage, scores,
      opportunities, Intent, and Buying Group coverage.
  - area: Internal person data
    description: >-
      Find CRM-known contacts and leads using identity, role, engagement, and Buying
      Group membership.
  - area: Account-level Intent
    description: >-
      Identify accounts demonstrating recent Intent based on keywords, keyword sets,
      competitive research, strength, and activity date.
  - area: Buying Groups
    description: >-
      Retrieve configured Buying Groups, personas, and buyer roles; assess coverage and
      identify gaps.
  - area: Account Briefs
    description: >-
      Generate consolidated, meeting-ready account summaries using available account,
      opportunity, engagement, Intent, Buying Group, company, and news data.
  - area: Global company data
    description: >-
      Research companies using firmographics, industries, location, size, technologies,
      news, and corporate hierarchy.
  - area: Global contact data
    description: >-
      Find external contacts using role, seniority, location, employment, and contact
      criteria.
  - area: Net-new contacts
    description: >-
      Find relevant external contacts for a specific account who are associated with its
      Buying Groups and are not already represented in CRM.
  - area: Reference data
    description: >-
      Retrieve tenant-configured account lists, keyword sets, keywords, Buying Groups,
      personas, and buyer roles.
