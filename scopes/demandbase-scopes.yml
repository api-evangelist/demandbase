docs: https://developer.demandbase.com/docs/custom-mcp-clients
note: >-
  The REST platform APIs declare NO oauth2 security scheme and NO scopes — they use an
  opaque bearer token minted by a client-credentials exchange, with authorization decided
  server-side by the API Key Set's assigned permissions and the tenant's Export Collection.
  `python3 0-working/derive-oauth-scopes.py demandbase` therefore finds zero scopes in the
  OpenAPI, which is correct. The only real scope surface Demandbase publishes belongs to the
  MCP gateway, and it is recorded here from that server's own RFC 8414 / RFC 9728 metadata.
surfaces:
  rest:
    oauth2: false
    scopes: []
    authorization_model: >-
      Permission Sets in Demandbase One plus per-integration API Key Set permissions plus
      the tenant's Export Collection entitlement. None of these are expressed as OAuth
      scopes on the wire.
  mcp:
    oauth2: true
    resource: https://gateway.demandbase.com/mcp/
    authorization_servers:
      - https://gateway.demandbase.com
schemes:
  - name: MCP gateway OAuth
    source: well-known/demandbase-oauth-authorization-server.json
    issuer: https://authentication.demandbase.com/oauth2/aus7fu7m8kDj90Z532p7
