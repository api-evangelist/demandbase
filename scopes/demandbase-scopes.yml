observation: >-
  The MCP scope set is identity-only. There is no per-capability scope — nothing that
  separates "read my accounts" from "read global company data" from "generate an account
  brief". Data-level authorization is enforced entirely by Demandbase One Permission Sets
  after the token is presented, so the token itself carries no least-privilege signal an
  agent operator can reason about or downscope.
