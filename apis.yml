aid: demandbase
name: Demandbase
description: Demandbase is a B2B go-to-market platform that unifies account intelligence, intent data, advertising,
  orchestration, personalization and sales intelligence into a single pipeline engine. Its developer surface is
  eight OpenAPI-documented REST APIs on uapi.demandbase.com — B2B company/contact intelligence, Data Export, Data
  Import, Admin, Intent (beta), Usage, Custom Sources and Auth — plus a hosted, OAuth-protected Model Context Protocol
  server that exposes account, person, intent, buying-group and account-brief capabilities to AI assistants, an
  official Python SDK, and a change-subscription webhook surface.
type: Index
