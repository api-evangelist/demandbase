apis:
- name: Demandbase MCP Server
  description: >-
    Hosted remote Model Context Protocol server exposing Demandbase account, person, intent, buying-group,
    account-brief, global company/contact and reference capabilities to AI assistants. OAuth 2.1 authorization-code
    + PKCE with dynamic client registration; tools/list is tenant-gated.
  humanURL: https://developer.demandbase.com/docs/mcp
  baseURL: https://gateway.demandbase.com/mcp/servers/db-mcp
  properties:
  - type: MCPServer
    url: mcp/demandbase-mcp.yml
  - type: ToolCrosswalk
    url: mcp/demandbase-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.demandbase.com/docs/mcp
  - type: GettingStarted
    url: https://developer.demandbase.com/docs/custom-mcp-clients
  - type: Authentication
    url: authentication/demandbase-authentication.yml
  - type: OAuthScopes
    url: scopes/demandbase-scopes.yml
- name: Demandbase IP-API v3
  description: >-
    Real-time visitor identification: resolves a visitor IP address to a Demandbase company ID, firmographics
    and corporate hierarchy for web personalization, forms enrichment and analytics integrations. No OpenAPI
    is published for this API and its reference documentation sits on the support knowledge base, which
    is behind a bot challenge.
  humanURL: >-
    https://support.demandbase.com/hc/en-us/articles/23789223879323-Demandbase-IP-API-v3-for-Demandbase-One-Current-Version
  baseURL: https://api.company-target.com
