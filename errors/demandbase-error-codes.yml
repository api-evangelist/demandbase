generated: '2026-08-13'
method: searched
source: https://developer.demandbase.com/docs/handling-errors
format: vendor-error-code
note: >-
  Demandbase publishes a stable numeric error registry, not RFC 9457 problem+json. The
  envelope is a flat JSON object; the first three digits of errorCode always match the HTTP
  status, which makes the code both greppable and status-consistent. diagnosticCode is an
  opaque per-request identifier for support escalation and must not be parsed. The registry
  below is transcribed verbatim from the Handling Errors reference and is scoped to the Data
  Export API, which is the only surface for which Demandbase publishes codes; the B2B,
  Import, Admin, Intent, Usage and Custom Sources APIs return the same HTTP statuses but
  their code lists are not published.
envelope:
  content_type: application/json
  fields:
    - name: errorCode
      description: >-
        Stable Demandbase error identifier. The first three digits match the HTTP status.
        Use this value when handling a specific failure in your application.
    - name: errorMessage
      description: Human-readable details about the failure. Values from the request may be included.
    - name: diagnosticCode
      description: >-
        Opaque identifier for the individual API request. Record it in your logs and include
        it when contacting support. Do not parse it or use it for application logic.
  example: |
    {
      "errorCode": "400-115",
      "errorMessage": "Invalid field names: {Account}.All, {Account}.test",
      "diagnosticCode": "ce0fc1770e0d425b88892df4f663bf07"
    }
statuses:
  - status: 400
    meaning: The request is invalid.
    action: Correct the indicated parameter or payload. Do not retry the same request unchanged.
    retryable: false
  - status: 401
    meaning: Authentication credentials are missing or invalid.
    action: Obtain a valid access token and retry.
    retryable: true
  - status: 403
    meaning: The authenticated API key or tenant cannot access the requested resource.
    action: Verify API-key permissions, enabled Export collections, and tenant access.
    retryable: false
  - status: 404
    meaning: The requested resource or job does not exist.
    action: Verify the identifier and that it belongs to the authenticated tenant.
    retryable: false
  - status: 429
    meaning: A request, concurrency, or export quota was exceeded.
    action: Back off before retrying.
    retryable: true
  - status: 500
    meaning: Demandbase could not complete the request because of a temporary service failure.
    action: Retry with backoff; escalate with the diagnosticCode if it persists.
    retryable: true
