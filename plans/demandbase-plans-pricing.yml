metering:
  unit: credits
  description: >-
    API and MCP consumption draws down credit entitlements assigned to the tenant. Credit
    rates and entitlement sizes are set per contract and are not published.
  observable_at_runtime: true
  usage_endpoint: openapi/demandbase-usage-openapi.yml#getCreditUsageDetails
  usage_path: GET https://uapi.demandbase.com/reporting/v1/usage
  docs:
    - https://developer.demandbase.com/docs/credit-consumtion-model
    - https://developer.demandbase.com/docs/credit-consumption
trial:
  name: Export API trial
  allowance: 100 MB of exported data per rolling 24-hour period
  scope: shared across all exports; does not reset per request
  price: null
  availability: >-
    Arranged through the Demandbase account team, not self-serve. There is also an API trial
    signup at https://www.demandbase.com/products/data/api-integration/api-trial/.
  docs: https://developer.demandbase.com/docs/rate-limits
signup: https://www.demandbase.com/products/data/api-integration/api-trial/
