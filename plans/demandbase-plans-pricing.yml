description: >-
  Demandbase publishes no priced, self-serve API plan. The pricing page states the model in
  words — a platform fee covering the software and services, plus a flat fee per user — and
  then routes every buyer to a form for a custom quote. API access is bundled into the
  platform contract rather than sold or metered publicly. What IS metered, and what a
  developer can actually observe at runtime, is credits: API and MCP calls draw down credit
  entitlements that are readable through the Usage API. There is also a documented Export
  API trial (100 MB over a rolling 24-hour window), which is the only quantified, publicly
  stated allowance on any Demandbase API surface.
notes: >-
  Re-searched 2026-08-13, replacing the 2026-05-04 bulk-sweep scaffold. The conclusion is
  unchanged — no public per-call price exists — but it is now a searched finding with the
  credit model and the trial allowance attached, rather than an unverified stub.
