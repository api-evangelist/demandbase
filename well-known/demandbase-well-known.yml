note: >-
  Demandbase serves real discovery documents on two hosts. gateway.demandbase.com
  (the MCP gateway) publishes RFC 9728 protected-resource metadata and RFC 8414
  authorization-server metadata; authentication.demandbase.com (Okta-backed) publishes
  full OIDC discovery. The API host uapi.demandbase.com and the marketing host
  www.demandbase.com serve nothing at /.well-known/ — recorded below as honest 404s.
  No security.txt (RFC 9116) is served on any Demandbase host.
hosts:
