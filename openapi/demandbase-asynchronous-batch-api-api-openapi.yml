components:
  schemas:
    JobRequestDTO:
      type: object
      properties:
        jobType:
          type: string
          description: 'There are four supported job types:

            | Job Type        | Description                                                  |

            | --------------- | ------------------------------------------------------------ |

            | `companyFetch`  | Retrieve companies by `companyId`.                           |

            | `contactFetch`  | Retrieve contacts by `contactId`.                            |

            | `companySearch` | Retrieve companies using filters (e.g., location, industry). |

            | `contactSearch` | Retrieve contacts using filters (e.g., name, job function).  |'
        jobName:
          type: string
          description: Descriptive name, max 50 characters.
          maxLength: 50
        fields:
          type: array
          description: ' List of fields to include in the output. Use "all" to fetch all available fields'
          items:
            type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/JobFilter'
        sortOrder:
          type: string
        sortBy:
          type: string
      required:
      - jobType
      - jobName
      - fields
      - filters
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorMessage:
          type: string
        diagnosticCode:
          type: string
      xml:
        name: error
    BulkJobStatusDTO:
      type: object
      properties:
        jobName:
          type: string
        jobStatus:
          type: string
        jobType:
          type: string
        jobId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        resultsUrl:
          type: string
        message:
          type: string
      xml:
        name: BulkJobStatus
    JobFilter:
      type: object
      properties:
        field:
          type: string
          description: 'Restrictions:

            <ul>

            <li>companyFetch: Only companyId is allowed.</li>

            <li>contactFetch: Only contactId is allowed.</li>

            <li>companySearch: Use any valid company search filter field.</li>

            <li>contactSearch: Use valid contact search filter fields.</li>

            </ul>'
        values:
          type: array
          description: Array of string values to filter on
          items:
            type: string
      required:
      - field
      - values
  securitySchemes:
    bearerAuth:
      type: http
      description: '[<span style="text-decoration:underline;color:blue; font-size:1.25em">How To Generate Bearer Tokens</span>](https://developer.demandbase.com/reference/generate_access_token)'
      scheme: bearer
