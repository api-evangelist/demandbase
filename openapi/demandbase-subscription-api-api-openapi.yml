  /subscriptions/jobs:
    get:
      tags:
      - Subscription API
      summary: List Subscription Jobs
      description: 'Retrieve a paginated list of all subscription jobs created by your tenant. Results are returned in descending order by creation time (`createdAt`). You can apply filters based on time period, date range, job status, and job type.


        Period can be specified as `day`, `month`, or `year`. If `day` is selected, you can specify a range of days (e.g., 2024-09-01 to 2024-09-07). For `month`, you can specify a range of months (e.g., 2024-09 to 2024-10). For `year`, you can specify a range of years (e.g., 2024 to 2025 for the entire year).

        '
      operationId: subscriptionJobsListFetch
      parameters:
      - name: period
        in: query
        description: 'The time period type you want to filter jobs by.


          Valid values:

          - day

          - month

          - year

          '
        required: false
        schema:
          type: string
          enum:
          - day
          - month
          - year
          description: 'The time period type you want to filter jobs by.


            Valid values:

            - day

            - month

            - year

            '
          example: month
        examples:
          default:
            value: month
      - name: start
        in: query
        description: 'Start day/month/year(inclusive) for the selected period.


          Start format depends on the period type:

          - day: YYYY-MM-DD  (e.g., 2024-09-01)

          - month: YYYY-MM   (e.g., 2024-09)

          - year: YYYY       (e.g., 2024)

          '
        required: false
        schema:
          type: string
          description: 'Start day/month/year(inclusive) for the selected period.


            Start format depends on the period type:

            - day: YYYY-MM-DD  (e.g., 2024-09-01)

            - month: YYYY-MM   (e.g., 2024-09)

            - year: YYYY       (e.g., 2024)

            '
          example: 2024-09
        examples:
          default:
            value: 2024-09
      - name: end
        in: query
        description: 'End day/month/year(inclusive) for the selected period.


          End format depends on the period type:

          - day: YYYY-MM-DD  (e.g., 2024-09-30)

          - month: YYYY-MM   (e.g., 2024-10)

          - year: YYYY       (e.g., 2025)

          '
        required: false
        schema:
          type: string
          description: 'End day/month/year(inclusive) for the selected period.


            End format depends on the period type:

            - day: YYYY-MM-DD  (e.g., 2024-09-30)

            - month: YYYY-MM   (e.g., 2024-10)

            - year: YYYY       (e.g., 2025)

            '
          example: 2024-10
        examples:
          default:
            value: 2024-10
      - name: jobStatus
        in: query
        description: 'Filter jobs by their status.


          Valid values:

          - failed

          - accepted

          - processing

          - finished

          '
        required: false
        schema:
          type: string
