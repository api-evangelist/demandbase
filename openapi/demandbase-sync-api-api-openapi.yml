        in: query
        description: Comma-separated related-data expansions. Use `installedtech` to include technographics under `techUsed`.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - familytree
            - competitors
            - logos
            - installedtech
        example:
        - familytree
        - competitors
      - name: sortBy
        in: query
        description: Sort order for family tree results.
        required: false
        schema:
          type: string
