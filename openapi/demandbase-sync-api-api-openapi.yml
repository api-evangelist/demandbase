      summary: Fetch company details
      description: 'Use this endpoint to fetch detailed information about a single company, including name, location, phone number, revenue, employee count, industry classification, and social media links.


        You can optionally expand the response to include related data such as the company''s family tree, competitors, installed technologies, and logos.


