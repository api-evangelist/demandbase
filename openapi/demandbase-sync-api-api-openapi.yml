  /match:
    post:
      tags:
      - Sync API
      summary: Match companies and contact
      description: 'This endpoint matches companies and contacts against Demandbase''s database based on provided firmographic and contact details. This endpoint supports batch matching by accepting an array of match requests.


        Each object in the requests array must include a unique id and a useful combination of attributes for matching.


        At a minimum, at least one of the following company identifiers is required:

        - `name`

        - `websites`

        - `email`

        - `executiveLinkedInHandle`'
      operationId: match_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequestDTO'
      responses:
        '200':
          description: Successful operation or No companies found for query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponseDTO'
              examples:
                SuccessResponse:
                  description: SuccessResponse
                  value:
                    matches:
                    - id: id
                      companyMatches:
                      - company:
                          companyId: 726263
                          companyName: Microsoft Corporation
                          address:
                            street: 1 Microsoft Way
                            city: Redmond
                            state: WA
                            country: United States
                      contactMatches:
                      - contact:
                          dbPersonDetails:
                            dbPersonId: 243908534
                            firstName: Satya
                            lastName: Nadella
                          employmentDetails:
                            contactId: 310227204
                            companyId: 726263
                            companyName: Microsoft Corporation
                            titles:
                            - Chairman and CEO
                            contactQualityScore: A+
                EmptyCompaniesResponse:
                  description: EmptyCompaniesResponse
                  value:
                    matches:
                    - id: '2'
                      companyMatches: []
                      contactMatches: []
            application/xml:
              schema:
                $ref: '#/components/schemas/MatchResponseDTO'
              examples:
                SuccessResponseXml:
                  description: SuccessResponseXml
                  value:
                    matches:
                    - id: '1'
                      companyMatches:
                      - company:
                          companyId: 7573216
                          companyName: Google LLC
                          address:
                            city: Mountain View
                            state: CA
                            country: United States
                      contactMatches:
                      - contact:
                          dbPersonDetails:
                            dbPersonId: 50823422
                            firstName: Stefano
                            lastName: Gessati
                          employmentDetails:
                            contactId: 96208084
                            companyId: 7573216
                            companyName: Google LLC
                            titles:
                            - IT Resident
                    - id: '2'
                      companyMatches:
                      - company:
                          companyId: 724468
                          companyName: Apple Inc.
                          address:
                            city: Cupertino
                            state: CA
                            country: United States
                      contactMatches:
                      - contact:
                          dbPersonDetails:
                            dbPersonId: 215
                            firstName: Tim
                            lastName: Cook
                          employmentDetails:
                            contactId: 317995637
                            companyId: 724468
                            companyName: Apple Inc.
                            titles:
                            - CEO
                            contactQualityScore: A+
                EmptyCompaniesResponseXml:
                  description: EmptyCompaniesResponseXml
                  value:
                    matches:
                    - id: '2'
                      companyMatches: []
                      contactMatches: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRequestsErrorResponse:
                  description: InvalidRequestsErrorResponse
                  value:
                    errorCode: 400-165
                    errorMessage: The  match request should have non empty requests list.
                    diagnosticCode: 88c27a04-bd7c-43d6-b133-b0990572e0d2
                InvalidRequestBodyErrorResponse:
