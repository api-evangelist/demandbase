  /subscriptions/job/{jobId}:
    get:
      tags:
      - Subscription API
      summary: Check Subscription Job Status
      description: 'Retrieve the current status of a bulk subscription job using its unique job ID.

        After you submit a create or update subscription job request, you’ll receive a job ID.

        This endpoint allows you to monitor that job’s progress and determine whether it has completed successfully.


        If the job completes, the response will include the generated subscriptionId—which you can use to manage the subscription.

        If the job fails, the response will contain error details explaining what went wrong.

        '
      operationId: getSubscriptionJobStatus
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: string
          example: ln63a2kv6k2cm09cubar
        examples:
          default:
            value: ln63a2kv6k2cm09cubar
      responses:
        '200':
          description: Job status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSubscriptionJobStatusResponseDTO'
              examples:
                Success - JSON:
                  summary: A successful response showing job status
                  description: Success - JSON
                  value:
                    jobId: 39ddf756-c04e-465c-b8c1-8d2c2be0abed
                    subscriptionId: 63914a27-a5ca-4fdf-80b0-ffc985f53c14
                    jobStatus: finished
                    totalEntitiesProcessed: 5000
                    jobType: notificationSubscriptionCreate
                    subscriptionType: company
            application/xml:
              schema:
                $ref: '#/components/schemas/BulkSubscriptionJobStatusResponseDTO'
              examples:
                Success - XML:
                  summary: A successful XML response
                  description: Success - XML
                  value:
                    jobId: 39ddf756-c04e-465c-b8c1-8d2c2be0abed
                    subscriptionId: 63914a27-a5ca-4fdf-80b0-ffc985f53c14
                    jobStatus: finished
                    totalEntitiesProcessed: 5000
                    jobType: notificationSubscriptionCreate
                    subscriptionType: company
        '400':
          description: Invalid job ID or request format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Bad Request - Invalid Job ID:
                  description: Bad Request - Invalid Job ID
                  value:
                    errorCode: 400-139
                    errorMessage: Job Id should not be empty.
                    diagnosticCode: 15d8774c-f2a1-4352-ba65-386bf8d04ecf
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Bad Request XML:
                  description: Bad Request XML
                  value:
                    errorCode: 400-139
                    errorMessage: Job Id should not be empty.
                    diagnosticCode: 15d8774c-f2a1-4352-ba65-386bf8d04ecf
        '401':
          description: Unauthorized. Access token missing or invalid.
          content:
            application/json:
              examples:
                Unauthorized:
                  description: Unauthorized
                  value:
                    status: Authentication Failed - Unauthorized.
        '404':
          description: The specified job ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Job Not Found - JSON:
                  description: Job Not Found - JSON
                  value:
                    errorCode: 404-101
                    errorMessage: Invalid job ID, job not found.
                    diagnosticCode: 92ce43d0-a861-4394-b44d-420d114dcfcb
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Job Not Found - XML:
                  description: Job Not Found - XML
                  value:
                    errorCode: 404-101
                    errorMessage: Invalid job ID, job not found.
                    diagnosticCode: 92ce43d0-a861-4394-b44d-420d114dcfcb
      security:
      - bearerAuth: []
      servers:
      - url: https://uapi.demandbase.com/data/b2b/v1
        description: Server URL in Production environment
  /subscriptions:
    get:
      tags:
      - Subscription API
      summary: List Subscriptions
      description: 'Retrieve a list of all subscriptions associated with your tenant.

        You can filter results by one or more subscription types and paginate through the results.

        Results are returned in pages, with support for customizing the number of items per page.

        '
      operationId: getAllSubscriptionsByClientID
      parameters:
      - name: subscriptionType
        in: query
        description: 'Comma-separated list of subscription types to filter the results. Valid values include: company, companyNews,
          dbPerson, companyFamilyTree.'
        required: false
        schema:
          type: string
          example: company,companyNews
        examples:
          default:
            value: company,companyNews
      - name: page
        in: query
        description: Page number for pagination. Default is 1.
        required: false
        schema:
          type: integer
          default: 1
          example: 1
        examples:
          default:
            value: 1
      - name: perPage
        in: query
        description: Number of results per page. Default is 10, maximum is 50.
        required: false
        schema:
          type: integer
          default: 10
          example: 10
        examples:
          default:
            value: 10
      responses:
        '200':
          description: List of subscriptions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
              examples:
                Success - JSON:
                  description: Success - JSON
                  value:
                    subscriptions:
                    - name: Subscription Name
                      description: Subscription Description
                      subscriptionType: company
                      subscriptionId: '12345'
                    pageNo: 1
                    pageSize: 10
                    totalCount: 1
            application/xml:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
              examples:
                Success - XML:
                  description: Success - XML
                  value:
                    subscriptions:
                    - name: Subscription Name
                      description: Subscription Description
                      subscriptionType: company
                      subscriptionId: '12345'
                    pageNo: 1
                    pageSize: 10
                    totalCount: 1
        '400':
          description: Results per page value is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Results Per Page:
                  description: Invalid Results Per Page
                  value:
                    errorCode: 404-101
                    errorMessage: perPage must be between 1 and 50.
                    diagnosticCode: ccb84f25-236e-4bcf-be01-88b7dd673fb4
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Results Per Page - XML:
                  description: Invalid Results Per Page - XML
                  value:
                    errorCode: 404-101
                    errorMessage: perPage must be between 1 and 50.
                    diagnosticCode: ccb84f25-236e-4bcf-be01-88b7dd673fb4
      security:
      - bearerAuth: []
      servers:
      - url: https://uapi.demandbase.com/data/b2b/v1
        description: Server URL in Production environment
  /reference/{object}:
    get:
      tags:
      - Reference Tables
      summary: Get reference data for an object
      description: 'Returns tenant-specific reference values for the requested object. This B2B API route is backed by the
        Data Export API reference service and accepts B2B API credentials.


        Object names are case-insensitive.'
      operationId: getReferenceData
      parameters:
      - name: object
        in: path
        description: Reference object to retrieve.
        required: true
        schema:
          type: string
          enum:
          - IdealBuyingGroup
          - IdealBuyingGroupPersonaRole
          - BuyerRole
          - Persona
          - KeywordSet
          - KeywordSetMember
          - JobLevel
          - JobFunction
          - TopLevelIndustry
          - SubIndustry
          example: JobLevel
      responses:
        '200':
          description: Reference data fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponseDTO'
              examples:
                Job Levels Response:
                  description: Job-level reference values.
                  value:
                    objectType: JobLevel
                    data:
                    - id: 1
                      name: C Level
        '400':
          description: The requested reference object is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Object Response:
                  description: Invalid reference object.
                  value:
                    errorCode: 400-154
                    errorMessage: Path parameter 'refObj' must be one of 'IdealBuyingGroup', 'IdealBuyingGroupPersonaRole',
                      'BuyerRole', 'Persona', 'KeywordSet', 'KeywordSetMember', 'JobLevel', 'JobFunction', 'TopLevelIndustry'
                      or 'SubIndustry'
                    diagnosticCode: ccb84f25-236e-4bcf-be01-88b7dd673fb4
        '401':
          description: Unauthorized because the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
              examples:
                Unauthorized Response:
                  description: Authentication failed.
                  value:
                    status: Authentication Failed - Unauthorized.
        '403':
          description: The API key does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden Response:
                  description: The API key does not include B2B API access.
                  value:
                    errorCode: 403-102
                    errorMessage: API Key does not have privilege to access the requested resource
                    diagnosticCode: ccb84f25-236e-4bcf-be01-88b7dd673fb4
      security:
      - bearerAuth: []
      servers:
      - url: https://uapi.demandbase.com/data/b2b/v1
        description: Server URL in Production environment
